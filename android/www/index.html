<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ilmkhona0</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d47a1;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap { padding: 24px; }
      h1 { margin: 12px 0 4px; font-size: 24px; }
      p  { margin: 0; opacity: .85; font-size: 14px; }
      .dot {
        width: 10px; height: 10px; border-radius: 999px;
        background: #ff6b6b; display: inline-block; margin: 0 4px;
        animation: pulse 1s infinite ease-in-out;
      }
      .dot:nth-child(2) { animation-delay: .15s; }
      .dot:nth-child(3) { animation-delay: .30s; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: .6; }
        50%      { transform: scale(1.4); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>ilmkhona0</h1>
      <p>Loading…</p>
      <p style="margin-top:16px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
    </div>
    <script>
      // Capacitor's `server.url` setting takes over and navigates to the live site.
      // This file is only shown if the user is offline at launch.
      setTimeout(function() {
        if (!navigator.onLine) {
          document.querySelector("p").textContent = "No internet connection.";
        }
      }, 4000);
    </script>
  </body>
</html>

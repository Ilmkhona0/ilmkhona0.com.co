services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      # Persist user uploads (used when BLOB_READ_WRITE_TOKEN is not set)
      - ./uploads:/app/public/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
